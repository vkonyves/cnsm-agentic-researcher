run_name: pilot-tabular-network-data
experiment_family: tabular_ml
model_role: worker
topic_scope: 5G/6G Networks and Edge Computing Services
candidate_resources:
  - name: O-RAN power and KPI dataset
    kind: tabular regression or optimisation
    status: candidate; agents must verify access, licence, columns and baseline
  - name: 5G attack-detection dataset
    kind: tabular or flow-based classification
    status: candidate; agents must verify access, licence, labels and class balance
pilot_constraints:
  max_dataset_rows: 500
  cpu_only: true
  no_human_scientific_editing: true
  purpose: architecture smoke test only
